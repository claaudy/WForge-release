name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup target add x86_64-pc-windows-msvc
      - run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "wforge-$($env:GITHUB_REF_NAME.Substring(1)).exe"
          Copy-Item target/x86_64-pc-windows-msvc/release/wforge.exe $asset
          gh release create "$env:GITHUB_REF_NAME" $asset LICENSE assets/OFL-LXGWWenKaiLite.txt --verify-tag --generate-notes
