[package]
name = "wforge"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
reqwest = { version = "0.12", features = ["blocking", "stream", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
futures-util = "0.3"
open = "5"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
dirs = "6"
serde_json = "1"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
